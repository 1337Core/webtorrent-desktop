name: CI

on:
  pull_request:
  # Actions caches are readable from the branch that wrote them and from the
  # default branch. Without a run on master, every pull request starts cold.
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    name: Apple Silicon PR gate
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      # Every archive is re-hashed against the pins in acquire-artifacts.mjs
      # before use, and discarded on mismatch, so a restored entry is checked
      # exactly as a freshly downloaded one is.
      - name: Restore reviewed native artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts
          key: artifacts-${{ runner.os }}-${{ hashFiles('scripts/acquire-artifacts.mjs') }}

      - name: Acquire reviewed native artifacts
        run: npm run artifacts

      - name: Restore incremental check caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run deterministic checks
        run: npm test

      - name: Run native end-to-end tests
        run: npm run e2e

      - name: Verify packaged application
        run: npm run package:check
